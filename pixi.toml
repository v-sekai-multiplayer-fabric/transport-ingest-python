[workspace]
name = "transport-ingest-python"
version = "0.1.0"
description = "A second implementation of the unreliable half of the fabric's WebTransport contract, on aioquic, checked against the golden vectors contract-entity-packet emits."
channels = ["conda-forge"]
# The three platforms this is developed and built on. iceoryx2 is shared memory, so a run needs
# a machine rather than a cluster; these are the machines.
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
# aioquic runs on 3.9 and newer and iceoryx2 on 3.8, so the pin is a choice rather than a floor.
# Pinning the minor keeps `pixi run` identical here and in CI, which is the whole reason the
# tasks below are the CI entry points.
python = "3.12.*"

[pypi-dependencies]
# aioquic implements QUIC and TLS 1.3 in Python from the RFCs, sharing no code with the picoquic
# the C pair vendors. That is what makes this a second opinion rather than a second copy, and it
# is why RFD 0123 chose it over binding picoquic from Python.
aioquic = "==1.3.0"
# iceoryx2 ships binary wheels for every platform above, so it is not built from source and no
# Rust toolchain is required. RFD 0123 records why a wheel is acceptable here where the C
# repositories dlopen iceoryx2 through a generated stub table instead.
iceoryx2 = "==0.9.3"

[tasks]
# CI entry points. The workflow calls these so local and CI run the same commands.
check = "python conformance.py"
selftest = "python conformance.py --self-test"
serve = "python -m ingest_python.receiver --cert cert.pem --key key.pem"
